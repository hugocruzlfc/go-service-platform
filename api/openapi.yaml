openapi: 3.0.3
info:
  title: Go Service Platform API
  version: 1.0.0
  description: HTTP API for managing tasks and reporting service health.
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service liveness
      description: Returns a successful response while the service process is running.
      tags:
        - health
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /healthz:
    get:
      operationId: getHealthz
      summary: Check service liveness
      description: Kubernetes-style alias for the health endpoint.
      tags:
        - health
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      operationId: getReadiness
      summary: Check service readiness
      description: Returns whether the service can receive traffic.
      tags:
        - health
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /version:
    get:
      operationId: getVersion
      summary: Get service version
      tags:
        - system
      responses:
        '200':
          description: Current service version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /tasks:
    get:
      operationId: listTasks
      summary: List tasks
      tags:
        - tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tasks ordered by ID.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Missing, malformed, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: createTask
      summary: Create a task
      tags:
        - tasks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request body or task title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, malformed, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task
      tags:
        - tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique task identifier.
          schema:
            type: string
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, malformed, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      operationId: updateTask
      summary: Update a task
      tags:
        - tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique task identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid update request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, malformed, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: deleteTask
      summary: Delete a task
      tags:
        - tasks
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique task identifier.
          schema:
            type: string
      responses:
        '204':
          description: Task deleted.
        '404':
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, malformed, or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      operationId: registerUser
      summary: Register a user
      description: Creates a user with an email and password. Does not log the user in.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: loginUser
      summary: Log in
      description: Returns an access token and a refresh token. The refresh token is also set as a Secure, HttpOnly cookie scoped to /auth.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: Refresh token cookie (HttpOnly, Secure, Path=/auth).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the session
      description: Exchanges a refresh token for a new token pair. The refresh token is read from the refresh_token cookie or from the request body.
      tags:
        - auth
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token cookie set by login or refresh.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued.
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Refresh token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      operationId: logoutUser
      summary: Log out
      description: Revokes the refresh token. The refresh token is read from the refresh_token cookie or from the request body. Always returns 204 when the token is missing or already invalid.
      tags:
        - auth
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          description: Refresh token cookie to revoke.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session ended. Clears the refresh token cookie.
          headers:
            Set-Cookie:
              description: Expired refresh token cookie.
              schema:
                type: string
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by POST /auth/login or POST /auth/refresh.

  schemas:
    AuthTokens:
      type: object
      description: Access and refresh tokens issued after login or refresh.
      required:
        - accessToken
        - expiresAt
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT sent as "Authorization: Bearer <token>".'
        refreshToken:
          type: string
          description: Opaque refresh token. Omitted from responses that only set the cookie.
        expiresAt:
          type: string
          format: date-time
          description: UTC time at which the access token expires.

    CreateTaskRequest:
      type: object
      description: Payload used to create a task.
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          description: Task title. Whitespace is trimmed by the service.
          maxLength: 120

    ErrorDetail:
      type: object
      description: Machine-readable error information returned by the current API.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable application error code.
        message:
          type: string
          description: Safe human-readable error message.

    ErrorResponse:
      type: object
      description: Error response returned by the current API.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    LoginRequest:
      type: object
      description: Credentials used to log in.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    HealthResponse:
      type: object
      description: Service health status and response timestamp.
      required:
        - status
        - time
      properties:
        status:
          type: string
          description: Current health status.
        time:
          type: string
          format: date-time
          description: UTC timestamp at which the response was generated.

    RefreshRequest:
      type: object
      description: Refresh token in the body. Not needed when the refresh_token cookie is sent.
      additionalProperties: false
      properties:
        refreshToken:
          type: string

    RegisterRequest:
      type: object
      description: Details used to create a user.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Task:
      type: object
      description: A task managed by the service.
      required:
        - id
        - title
        - completed
        - createdAt
      properties:
        id:
          type: string
          description: Unique task identifier.
        title:
          type: string
          description: Trimmed task title.
        completed:
          type: boolean
          description: Whether the task has been completed.
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp at which the task was created.

    UpdateTaskRequest:
      type: object
      description: Fields that can be changed on an existing task.
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          description: New task title. Whitespace is trimmed by the service.
          maxLength: 120
        completed:
          type: boolean
          description: New completion state for the task.

    User:
      type: object
      description: A registered user. The password is never returned.
      required:
        - id
        - email
        - createdAt
        - disabled
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        disabled:
          type: boolean

    VersionResponse:
      type: object
      description: Current service version.
      required:
        - version
      properties:
        version:
          type: string
          description: Semantic version of the service.
